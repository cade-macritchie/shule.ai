# Static preview of the marketing pages (landing + intake) on GitHub Pages.
# Builds on every push to main and publishes to the gh-pages branch.
# One-time setup: Settings → Pages → Source: "Deploy from a branch", Branch: gh-pages / (root).
name: Pages preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages-preview
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: scripts/build-pages.sh "/${{ github.event.repository.name }}" pages-out
      - name: Publish to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd pages-out
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Pages preview for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
